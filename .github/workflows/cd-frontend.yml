name: cd-frontend

# ci-frontend가 성공해야 실행(workflow_run 체이닝) → 빌드·S3·CloudFront. 수동 실행도 가능.
on:
  workflow_run:
    workflows: ["ci-frontend"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  deploy:
    # CI 성공일 때만(수동 실행 포함)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}   # CI가 돌린 그 커밋을 빌드
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}   # 예: https://api.skku.site
          VITE_WS_BASE: ${{ vars.VITE_WS_BASE }}      # 예: wss://api.skku.site
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2
      - name: S3 동기화
        run: aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}" --delete
      - name: CloudFront 무효화
        run: aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_ID }}" --paths "/*"
